name: Bug Report
description: Report a bug or unexpected behavior.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the behavior.
      placeholder: |
        1. Configure AuthService with...
        2. App starts, ServiceStartup runs...
        3. Observe error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: input
    id: go-version
    attributes:
      label: Go version
      description: Output of `go version`
      placeholder: "go1.26.5 linux/amd64"
    validations:
      required: true
  - type: input
    id: library-version
    attributes:
      label: Library version
      description: The versions of wails-pkceflow and go-pkceflow you are using.
      placeholder: "wails-pkceflow v0.1.0 / go-pkceflow v0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - iOS
        - Android
        - Other
    validations:
      required: true
  - type: input
    id: wails-version
    attributes:
      label: Wails version
      description: Output of `wails version`
      placeholder: "v3.0.0"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Copy and paste any relevant log output. Ensure no tokens or secrets are included.
      render: shell
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Any other context about the problem (screenshots, related issues, etc.).
    validations:
      required: false

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      # This is a cross-distro library: newer distros use the Wails v3 default
      # gtk4/webkitgtk-6.0 backend, while Ubuntu <=24.04 and other gtk3-only
      # environments build and run with -tags gtk3. Install both stacks and
      # exercise both backends so neither regresses.
      - name: Install Wails v3 Linux dependencies (gtk3 + gtk4)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Test (gtk4, default)
        run: go test -race -coverprofile=coverage.out ./...

      - name: Test (gtk3)
        run: go test -race -tags gtk3 ./...

      - name: Upload coverage
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Install Wails v3 Linux dependencies (gtk3 + gtk4)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build (gtk4, default)
        run: go build ./...

      - name: Build (gtk3)
        run: go build -tags gtk3 ./...

      - name: Verify go.mod/go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  # Cross-platform compilation ensures the wrapper (and the example app) build
  # on every OS Wails v3 targets. Windows is CGo-free (WebView2); macOS needs
  # Cocoa (pre-installed on GitHub macOS runners); Linux is covered above.
  cross-build:
    name: Cross-build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-amd64
            runner: ubuntu-latest
            goos: windows
            goarch: amd64
            cgo: "0"
            tags: ""
            install: ""
          - target: macos-arm64
            runner: macos-latest
            goos: darwin
            goarch: arm64
            cgo: "1"
            tags: ""
            install: ""
          - target: macos-amd64
            runner: macos-latest
            goos: darwin
            goarch: amd64
            cgo: "1"
            tags: ""
            install: ""
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Install platform dependencies
        if: matrix.install != ''
        run: ${{ matrix.install }}

      - name: Build wrapper module
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -tags "${{ matrix.tags }}" ./...

      - name: Build example app
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOPRIVATE: github.com/GyldendalDigital/*
        working-directory: examples/wails-desktop
        run: go build -tags "${{ matrix.tags }}" -o /dev/null .
